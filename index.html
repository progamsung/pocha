<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>온라인 심야 포차 | Moonlit Pocha</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #08080c; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; color: #fff; }
    
    #canvas-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }

    /* 35mm 필름 그레인 & 감성 비네팅 */
    .film-grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.16;
      background-image: radial-gradient(#fff 10%, transparent 11%), radial-gradient(#000 10%, transparent 11%);
      background-size: 3px 3px; z-index: 5;
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(6,5,4,0.85) 100%);
      z-index: 6;
    }

    /* 산사 스타일 상단 헤더 */
    .top-hud {
      position: absolute; top: 18px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center; z-index: 20; pointer-events: none;
    }
    .badge-status {
      pointer-events: auto; background: rgba(22, 17, 14, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(249, 115, 22, 0.4); padding: 8px 16px; border-radius: 20px;
      color: #ffeedd; font-size: 13px; display: flex; align-items: center; gap: 8px;
    }
    .dot-live { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
    
    .weather-select {
      pointer-events: auto; background: rgba(22, 17, 14, 0.85); border: 1px solid rgba(249, 115, 22, 0.4);
      color: #ffeedd; padding: 7px 14px; border-radius: 20px; font-size: 13px; outline: none; cursor: pointer;
    }
    .btn-sound {
      pointer-events: auto; background: rgba(22, 17, 14, 0.85); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 13px;
    }

    /* 산사 스타일 하단 독(Dock) 바 */
    .bottom-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 20;
      width: min(580px, 94vw);
    }
    .dock-actions {
      display: flex; gap: 8px; background: rgba(18, 14, 12, 0.85); border: 1px solid rgba(249, 115, 22, 0.35);
      padding: 6px 12px; border-radius: 24px; backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .dock-btn {
      background: none; border: none; color: #f5dfd0; font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 16px; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 5px;
    }
    .dock-btn:hover { background: #ea580c; color: #fff; }

    .chat-box { width: 100%; display: flex; gap: 8px; }
    .chat-box input {
      flex: 1; background: rgba(22, 17, 14, 0.92); border: 1px solid rgba(249, 115, 22, 0.4);
      padding: 12px 18px; border-radius: 25px; color: #fff; font-size: 14px; outline: none;
    }
    .chat-box input:focus { border-color: #f97316; box-shadow: 0 0 12px rgba(249,115,22,0.4); }
    .chat-box button {
      background: #ea580c; border: none; color: #fff; padding: 0 22px; border-radius: 25px;
      font-weight: bold; cursor: pointer;
    }

    /* 상호작용 안내 툴팁 */
    #interact-hint {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 14, 12, 0.88); border: 1px solid #ea580c; color: #ffeedd;
      padding: 7px 16px; border-radius: 20px; font-size: 12px; pointer-events: none;
      display: none; z-index: 15; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* 토스트 알림창 */
    #toast-msg {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(18, 14, 12, 0.95); border: 2px solid #ea580c; color: #fff;
      padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: bold;
      pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 30; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    /* 모달 공통 */
    .modal {
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 60;
    }
    .modal.active { display: flex; }
    .modal-card {
      background: #1c1512; border: 1px solid #4a382e; border-radius: 18px;
      width: min(480px, 92vw); padding: 26px; color: #f5ece5; position: relative;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9); max-height: 85vh; overflow-y: auto;
    }
    .modal-close { position: absolute; top: 16px; right: 18px; background: none; border: none; color: #aaa; font-size: 22px; cursor: pointer; }
    
    /* 레트로 위로 영수증 */
    .receipt-box {
      background: #fffdf5; color: #1c1917; font-family: 'Courier New', monospace;
      padding: 20px; border-radius: 6px; margin: 18px 0; border: 1px dashed #777;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5); line-height: 1.6;
    }
    .receipt-title { text-align: center; font-weight: bold; font-size: 16px; border-bottom: 2px dashed #333; padding-bottom: 8px; margin-bottom: 12px; }
    .btn-submit {
      width: 100%; background: #ea580c; border: none; padding: 13px; border-radius: 10px;
      color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="1024" height="680"></canvas>
  </div>
  <div class="film-grain"></div>
  <div class="vignette"></div>

  <!-- 상호작용 힌트 툴팁 -->
  <div id="interact-hint">스페이스바를 누르거나 클릭해 대화하기</div>
  <div id="toast-msg"></div>

  <!-- 상단 HUD -->
  <div class="top-hud">
    <div style="display:flex; gap:8px; align-items:center;">
      <div class="badge-status">
        <span class="dot-live"></span>
        <span>심야 온(溫)포차 • 머무는 중</span>
      </div>
      <select class="weather-select" id="weatherSelect" onchange="changeWeather(this.value)">
        <option value="rain">🌧️ 비 내리는 밤</option>
        <option value="snow">❄️ 눈 내리는 밤</option>
        <option value="clear">✨ 맑은 별밤</option>
        <option value="fog">🌫️ 몽환적인 밤안개</option>
      </select>
    </div>
    <button class="btn-sound" id="soundToggle">🌧️ 빗소리 켜기</button>
  </div>

  <!-- 하단 독(Dock) & 채팅 바 -->
  <div class="bottom-bar">
    <div class="dock-actions">
      <button class="dock-btn" onclick="openImo()">👵 이모님 위로 안주</button>
      <button class="dock-btn" onclick="cheersDrink()">🍶 랜선 건배 (짠!)</button>
      <button class="dock-btn" onclick="openWall()">🪵 합판 낙서벽</button>
      <button class="dock-btn" onclick="moveToTent()">⛺ 포차 안으로 가기</button>
    </div>
    <form class="chat-box" id="chatForm" onsubmit="event.preventDefault(); sendChat();">
      <input type="text" id="chatInput" placeholder="머리 위에 띄울 이야기를 적어보세요 (Enter)" maxlength="30" autocomplete="off" />
      <button type="submit">말하기</button>
    </form>
  </div>

  <!-- 이모님 고민 처방 모달 -->
  <div class="modal" id="imoModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('imoModal')">✕</button>
      <h3 style="color:#f97316; margin-bottom:6px;">👵 포차 이모님</h3>
      <p style="font-size:13px; color:#aaa; margin-bottom:15px;">"비도 오고 날도 찬데, 속상한 일 있으면 편하게 털어놔요. 이모가 가만히 들어줄 테니까."</p>
      <textarea id="worryInput" style="width:100%; height:85px; background:#291e19; border:1px solid #544034; border-radius:8px; padding:12px; color:#fff; font-size:14px; resize:none;" placeholder="오늘 있었던 일이나 마음에 걸리는 생각을 편하게 적어보세요"></textarea>
      <button class="btn-submit" onclick="prescribeAdvice()">이모님 처방과 안주 받기</button>

      <div id="receiptResult" style="display:none;" class="receipt-box">
        <div class="receipt-title">심 야 온 포 차 • 위 로 영 수 증</div>
        <div style="font-size:12px; color:#666; margin-bottom:8px;">
          일시: <span id="receiptDate"></span><br>
          마음 상태: <span id="receiptMood" style="font-weight:bold; color:#ea580c;"></span>
        </div>
        <div style="border-top:1px dashed #ccc; border-bottom:1px dashed #ccc; padding:12px 0; margin-bottom:10px;">
          <div style="font-weight:bold; font-size:14px; margin-bottom:4px;" id="receiptDish"></div>
          <div style="font-size:13px; color:#333; margin-top:6px; word-break:keep-all; line-height:1.7;" id="receiptAdvice"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
          <span>청구 금액</span>
          <span>0원 (오늘 밤은 푹 쉬어가기)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 합판 낙서벽 모달 -->
  <div class="modal" id="wallModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('wallModal')">✕</button>
      <h3 style="color:#f97316; margin-bottom:10px;">🪵 합판 낙서벽</h3>
      <div id="wallList" style="height:170px; overflow-y:auto; background:#291e19; border-radius:8px; padding:12px; margin-bottom:12px; font-size:13px; line-height:1.8; border:1px solid #544034;">
        <div>- 다들 내일은 오늘보다 덜 힘들기를.</div>
        <div>- 한 걸음 늦게 가도 괜찮아, 다 괜찮아.</div>
        <div>- 빗소리 들으면서 앉아있으니 마음이 스르르 풀린다.</div>
        <div>- 버텨낸 것만으로도 오늘 충분히 잘했어.</div>
      </div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="wallInput" placeholder="벽에 흔적 남기기 (최대 30자)" maxlength="30" style="flex:1; background:#291e19; border:1px solid #544034; border-radius:8px; padding:10px; color:#fff; font-size:13px;" />
        <button class="btn-submit" style="width:auto; margin:0;" onclick="postWall()">새기기</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 캔버스 2.5D 메타버스 렌더러
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 플레이어 캐릭터 (산사 스타일 동글동글 아바타)
    const player = {
      x: 220, y: 520,
      targetX: 220, targetY: 520,
      speed: 3.8,
      walkFrame: 0,
      isWalking: false,
      color: '#ea580c',
      name: '나 (손님)',
      msg: '',
      msgTimer: 0
    };

    // 포차 등장인물들 (NPC)
    const npcs = [
      {
        id: 'imo',
        x: 640, y: 195,
        color: '#f97316',
        name: '👵 포차 이모님',
        msg: '비도 오는데 얼른 들어와 쉬어요~',
        msgTimer: 300,
        isImo: true
      },
      {
        id: 'guest1',
        x: 520, y: 440,
        color: '#38bdf8',
        name: '손님 영희',
        msg: '어묵 국물이 진짜 진국이네...',
        msgTimer: 240
      },
      {
        id: 'guest2',
        x: 770, y: 440,
        color: '#a855f7',
        name: '손님 철수',
        msg: '오늘 하루도 어떻게든 버텼다.',
        msgTimer: 200
      }
    ];

    // 날씨 파티클
    let weather = 'rain';
    const particles = Array.from({length: 120}, () => ({
      x: Math.random() * 1024,
      y: Math.random() * 680,
      len: Math.random() * 15 + 10,
      speed: Math.random() * 6 + 10,
      size: Math.random() * 2 + 1
    }));

    // 김(스팀) 파티클
    const steams = Array.from({length: 15}, () => ({
      x: 600 + Math.random() * 90,
      y: 190 + Math.random() * 20,
      r: Math.random() * 6 + 4,
      alpha: Math.random() * 0.5 + 0.2,
      speedY: Math.random() * 0.8 + 0.6
    }));

    // ==========================================
    // 2. 포장마차 배경 환경 렌더링
    // ==========================================
    function drawPochaEnvironment() {
      // 1. 바깥 비 내리는 아스팔트 바닥
      ctx.fillStyle = '#0f1118';
      ctx.fillRect(0, 0, 1024, 680);

      // 물웅덩이 반사광 (빗속 골목)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.beginPath();
      ctx.ellipse(200, 480, 140, 45, 0, 0, Math.PI * 2);
      ctx.ellipse(260, 320, 90, 30, 0, 0, Math.PI * 2);
      ctx.fill();

      // 바깥 가로등 불빛
      const streetGrad = ctx.createRadialGradient(140, 100, 20, 140, 100, 220);
      streetGrad.addColorStop(0, 'rgba(255, 230, 160, 0.18)');
      streetGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = streetGrad;
      ctx.fillRect(0, 0, 380, 680);

      // 가로등 기둥
      ctx.fillStyle = '#1e222d';
      ctx.fillRect(136, 60, 8, 480);
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(140, 60, 12, 0, Math.PI * 2);
      ctx.fill();

      // 2. 포장마차 내부 바닥 (온기 도는 붉은빛 바닥)
      ctx.fillStyle = '#1c1310';
      ctx.fillRect(380, 80, 600, 540);

      // 천막 웜 라이트 조명
      const pochaGrad = ctx.createRadialGradient(680, 300, 40, 680, 300, 400);
      pochaGrad.addColorStop(0, 'rgba(249, 115, 22, 0.28)');
      pochaGrad.addColorStop(0.7, 'rgba(234, 88, 12, 0.1)');
      pochaGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pochaGrad;
      ctx.fillRect(380, 80, 600, 540);

      // 주황색 천막 지붕 구조 (상단)
      ctx.fillStyle = '#c2410c';
      ctx.beginPath();
      ctx.moveTo(360, 80);
      ctx.lineTo(990, 80);
      ctx.lineTo(970, 150);
      ctx.lineTo(380, 150);
      ctx.closePath();
      ctx.fill();

      // 천막 천 장식 주름
      ctx.fillStyle = '#9a3412';
      for(let x = 400; x < 970; x += 60) {
        ctx.beginPath();
        ctx.arc(x, 150, 28, 0, Math.PI);
        ctx.fill();
      }

      // 천막 지지 쇠기둥
      ctx.fillStyle = '#444';
      ctx.fillRect(375, 80, 10, 540);
      ctx.fillRect(980, 80, 10, 540);

      // 주황 백열전구
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(640, 80);
      ctx.lineTo(640, 130);
      ctx.stroke();

      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(640, 135, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(251, 146, 60, 0.4)';
      ctx.beginPath();
      ctx.arc(640, 135, 28, 0, Math.PI * 2);
      ctx.fill();

      // 3. 이모님 조리 카운터 (어묵 솥, 떡볶이 판)
      ctx.fillStyle = '#3a281e';
      ctx.fillRect(540, 160, 240, 70);
      ctx.fillStyle = '#271a13';
      ctx.fillRect(540, 225, 240, 15);

      // 어묵 솥 (은색 스테인리스)
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(555, 172, 85, 45);
      ctx.fillStyle = '#d97706'; // 어묵 국물
      ctx.fillRect(560, 177, 75, 35);
      // 어묵 꼬치 손잡이들
      ctx.fillStyle = '#d97706';
      ctx.fillRect(570, 162, 4, 15);
      ctx.fillRect(585, 160, 4, 17);
      ctx.fillRect(600, 163, 4, 14);

      // 떡볶이 판 (새빨간 색)
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(660, 172, 85, 45);
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(665, 177, 75, 35);

      // 김(스팀) 렌더링
      steams.forEach(s => {
        ctx.fillStyle = `rgba(255, 240, 230, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y -= s.speedY;
        s.r += 0.15;
        s.alpha -= 0.006;
        if(s.alpha <= 0 || s.y < 110) {
          s.y = 190 + Math.random() * 10;
          s.x = 560 + Math.random() * 180;
          s.r = Math.random() * 6 + 4;
          s.alpha = Math.random() * 0.4 + 0.2;
        }
      });

      // 4. 빨간 플라스틱 테이블 2개
      drawTable(540, 470);
      drawTable(790, 470);

      // 5. 합판 낙서벽 (상단 우측)
      ctx.fillStyle = '#2c1e17';
      ctx.fillRect(810, 170, 140, 80);
      ctx.strokeStyle = '#4a3529';
      ctx.lineWidth = 3;
      ctx.strokeRect(810, 170, 140, 80);
      ctx.fillStyle = '#fed7aa';
      ctx.font = '12px sans-serif';
      ctx.fillText('🪵 합판 낙서벽', 840, 205);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '10px sans-serif';
      ctx.fillText('가까이 가서 스페이스바', 825, 225);
    }

    function drawTable(x, y) {
      // 테이블 그림자
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(x, y + 10, 55, 25, 0, 0, Math.PI * 2);
      ctx.fill();

      // 빨간 원형 상판
      ctx.fillStyle = '#b91c1c';
      ctx.beginPath();
      ctx.ellipse(x, y, 52, 32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.ellipse(x, y - 2, 48, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      // 초록 소주병 & 잔
      ctx.fillStyle = '#15803d';
      ctx.fillRect(x - 5, y - 16, 7, 16);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(x + 10, y - 8, 6, 8);
    }

    // ==========================================
    // 3. 캐릭터(아바타) 렌더링 (산사 스타일 동글이)
    // ==========================================
    function drawCharacter(c, isMe) {
      ctx.save();
      const footOffset = c.isWalking ? Math.sin(c.walkFrame * 0.3) * 4 : 0;

      // 발밑 그림자
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(c.x, c.y + 14, 15, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 발 2개
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(c.x - 6, c.y + 14 + footOffset, 4, 0, Math.PI * 2);
      ctx.arc(c.x + 6, c.y + 14 - footOffset, 4, 0, Math.PI * 2);
      ctx.fill();

      // 몸통 (코트/패딩)
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y + 4, 13, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // 머리 (동글동글한 얼굴)
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(c.x, c.y - 12, 12, 0, Math.PI * 2);
      ctx.fill();

      // 눈
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(c.x - 3, c.y - 12, 1.5, 0, Math.PI * 2);
      ctx.arc(c.x + 3, c.y - 12, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // 이모님 전용: 앞치마 & 머리수건
      if (c.isImo) {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(c.x - 8, c.y + 2, 16, 12);
      }

      // 머리 위 이름 뱃지
      ctx.font = '11px sans-serif';
      ctx.fillStyle = isMe ? '#fb923c' : '#cbd5e1';
      ctx.textAlign = 'center';
      ctx.fillText(c.name, c.x, c.y - 28);

      // 머리 위 말풍선
      if (c.msg && c.msgTimer > 0) {
        c.msgTimer--;
        ctx.font = '13px sans-serif';
        const tw = ctx.measureText(c.msg).width;
        const bw = Math.max(tw + 20, 60);

        ctx.fillStyle = 'rgba(20, 16, 14, 0.92)';
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(c.x - bw / 2, c.y - 62, bw, 26, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.fillText(c.msg, c.x, c.y - 45);
      }

      ctx.restore();
    }

    // ==========================================
    // 4. 날씨 파티클 렌더링
    // ==========================================
    function drawWeather() {
      if (weather === 'rain') {
        ctx.strokeStyle = 'rgba(186, 215, 255, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        particles.forEach(p => {
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 2, p.y + p.len);
          p.y += p.speed;
          p.x -= 1;
          if (p.y > 680) { p.y = -20; p.x = Math.random() * 1024; }
        });
        ctx.stroke();
      } else if (weather === 'snow') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        particles.forEach(p => {
          ctx.moveTo(p.x, p.y);
          ctx.arc(p.x, p.y, p.size * 1.5, 0, Math.PI * 2);
          p.y += p.speed * 0.3;
          p.x += Math.sin(p.y * 0.02) * 0.8;
          if (p.y > 680) { p.y = -10; p.x = Math.random() * 1024; }
        });
        ctx.fill();
      } else if (weather === 'clear') {
        ctx.fillStyle = 'rgba(255, 245, 180, 0.7)';
        ctx.beginPath();
        particles.slice(0, 50).forEach(p => {
          ctx.moveTo(p.x, p.y);
          ctx.arc(p.x, p.y, p.size * 0.8, 0, Math.PI * 2);
        });
        ctx.fill();
      } else if (weather === 'fog') {
        ctx.fillStyle = 'rgba(200, 210, 220, 0.08)';
        ctx.fillRect(0, 0, 1024, 680);
      }
    }

    // ==========================================
    // 5. 키보드 & 마우스 조작 루프
    // ==========================================
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key === 'Enter') checkInteractions();
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // 마우스 클릭 시 목표 지점으로 걸어가기
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      player.targetX = (e.clientX - rect.left) * scaleX;
      player.targetY = (e.clientY - rect.top) * scaleY;
    });

    function update() {
      // 키보드 조작
      let dx = 0, dy = 0;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (keys['arrowright'] || keys['d']) dx += 1;
      if (keys['arrowup'] || keys['w']) dy -= 1;
      if (keys['arrowdown'] || keys['s']) dy += 1;

      if (dx !== 0 || dy !== 0) {
        player.x += dx * player.speed;
        player.y += dy * player.speed;
        player.targetX = player.x;
        player.targetY = player.y;
        player.isWalking = true;
        player.walkFrame++;
      } else {
        // 마우스 목표 지점 부드러운 이동
        const dist = Math.hypot(player.targetX - player.x, player.targetY - player.y);
        if (dist > 4) {
          player.x += ((player.targetX - player.x) / dist) * player.speed;
          player.y += ((player.targetY - player.y) / dist) * player.speed;
          player.isWalking = true;
          player.walkFrame++;
        } else {
          player.isWalking = false;
        }
      }

      // 화면 경계 제한
      player.x = Math.max(50, Math.min(970, player.x));
      player.y = Math.max(160, Math.min(620, player.y));

      // 근처 상호작용 검사 & 툴팁 표시
      const hint = document.getElementById('interact-hint');
      const distImo = Math.hypot(player.x - 640, player.y - 230);
      const distWall = Math.hypot(player.x - 880, player.y - 250);

      if (distImo < 75) {
        hint.textContent = '스페이스바를 눌러 이모님과 대화하기 👵';
        hint.style.display = 'block';
      } else if (distWall < 75) {
        hint.textContent = '스페이스바를 눌러 낙서벽 보기 🪵';
        hint.style.display = 'block';
      } else {
        hint.style.display = 'none';
      }

      // 화면 렌더링
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPochaEnvironment();
      npcs.forEach(n => drawCharacter(n, false));
      drawCharacter(player, true);
      drawWeather();

      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);

    // ==========================================
    // 6. 인터랙션 및 독 액션 제어
    // ==========================================
    function checkInteractions() {
      if (Math.hypot(player.x - 640, player.y - 230) < 85) openImo();
      if (Math.hypot(player.x - 880, player.y - 250) < 85) openWall();
    }

    function openImo() { document.getElementById('imoModal').classList.add('active'); }
    function openWall() { document.getElementById('wallModal').classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function moveToTent() {
      player.targetX = 640;
      player.targetY = 380;
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (!val) return;
      player.msg = val;
      player.msgTimer = 240; // 약 4초 표시
      input.value = '';
    }

    function cheersDrink() {
      playClinkSound();
      player.msg = '챙-! 다들 오늘 하루 수고 많았어요 🍶';
      player.msgTimer = 220;
      showToast('🍶 챙-! 포차 안의 손님들과 함께 잔을 부딪혔습니다.');
    }

    function showToast(text) {
      const t = document.getElementById('toast-msg');
      t.textContent = text;
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 3000);
    }

    function postWall() {
      const input = document.getElementById('wallInput');
      const val = input.value.trim();
      if (!val) return;
      const list = document.getElementById('wallList');
      const div = document.createElement('div');
      div.textContent = `- ${val}`;
      list.prepend(div);
      input.value = '';
    }

    // ==========================================
    // 7. 다정한 이모님 AI 처방 엔진
    // ==========================================
    const POCHA_AI = {
      work: {
        keywords: ['회사', '상사', '팀장', '부장', '퇴근', '야근', '일', '월급', '사표', '이직', '보고서', '혼났', '욕먹', '억울', '직장', '동료'],
        mood: '고된 하루에 지친 마음',
        dishes: ['연탄불에 구운 매콤 닭발 & 소주 반 잔', '청양고추 올린 담백한 오돌뼈', '바삭하게 부친 해물파전'],
        advice: '"오늘 하루 종일 긴장하고 있느라 어깨가 잔뜩 굳었네. 남의 기준 맞추려고 너무 애쓰지 마요. 내 마음 다치면서까지 완벽할 필요는 전혀 없어. 따뜻할 때 얼른 한 점 먹고, 오늘 고생한 건 빗물에 다 씻겨 보내요."'
      },
      money: {
        keywords: ['돈', '월급', '통장', '카드값', '빚', '주식', '코인', '거지', '가난', '잔고', '월세'],
        mood: '조급하고 막막해진 마음',
        dishes: ['따뜻하고 짭조름한 스팸 계란구이', '진한 멸치 육수의 잔치국수 곱빼기', '치즈 듬뿍 계란말이'],
        advice: '"열심히 사는데 자꾸 조급해지는 날이 있지요. 지금 조금 느리게 가는 것 같아도 손님이 묵묵히 걸어온 시간은 절대 배신하지 않아요. 따뜻하게 든든히 채워 넣어요. 손님은 반드시 잘 해낼 사람이야."'
      },
      love: {
        keywords: ['헤어졌', '이별', '차였', '연애', '남친', '여친', '애인', '보고싶', '눈물', '슬퍼', '마음', '그리워', '짝사랑'],
        mood: '찬바람 드는 시린 마음',
        dishes: ['속까지 확 풀리는 맑은 홍합탕', '부드러운 뚝배기 계란찜', '달콤한 토스트'],
        advice: '"눈가가 촉촉하네... 어디서 혼자 참고 울다 왔지요? 지나간 인연 때문에 스스로를 자책하지 마요. 그만큼 마음 아프다는 건 손님이 참 진심으로 사랑을 주었다는 예쁜 증거예요. 국물 식기 전에 따뜻하게 마셔요."'
      },
      general: {
        keywords: [],
        mood: '쓸쓸하고 헛헛한 심야의 공기',
        dishes: ['따뜻한 찰순대 한 접시', '노릇노릇 고소한 김치전', '맑은 조개탕'],
        advice: '"어서 와요! 날도 궂은데 발걸음 하느라 고생 많았지? 사는 게 매일 대단하지 않아도 괜찮아요. 이렇게 저녁에 따뜻한 거 먹고 쉬는 게 진짜 행복이지. 오늘 밤은 아무 걱정 말고 푹 쉬어가요."'
      }
    };

    function prescribeAdvice() {
      const input = document.getElementById('worryInput');
      const val = input.value.trim().toLowerCase();
      if (!val) { alert('이모한테 털어놓을 이야기를 편하게 적어줘요!'); return; }

      let cat = 'general';
      if (POCHA_AI.work.keywords.some(k => val.includes(k))) cat = 'work';
      else if (POCHA_AI.money.keywords.some(k => val.includes(k))) cat = 'money';
      else if (POCHA_AI.love.keywords.some(k => val.includes(k))) cat = 'love';

      const data = POCHA_AI[cat];
      const dish = data.dishes[Math.floor(Math.random() * data.dishes.length)];
      const now = new Date();

      document.getElementById('receiptDate').textContent = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('receiptMood').textContent = data.mood;
      document.getElementById('receiptDish').innerHTML = `처방 안주: <span style="color:#ea580c;">${dish}</span>`;
      document.getElementById('receiptAdvice').innerHTML = `<strong>이모의 한마디:</strong><br>${data.advice}`;
      document.getElementById('receiptResult').style.display = 'block';

      // 포차 안 이모님 머리 위에도 즉시 말풍선 반응
      npcs[0].msg = '손님아, 처방전 나왔으니 따뜻하게 챙겨 먹어라~';
      npcs[0].msgTimer = 260;
    }

    // ==========================================
    // 8. 날씨 변경 및 사운드 효과
    // ==========================================
    function changeWeather(val) {
      weather = val;
      const btn = document.getElementById('soundToggle');
      if (val === 'rain') btn.textContent = '🌧️ 빗소리 켜기';
      else if (val === 'snow') btn.textContent = '❄️ 바람소리 켜기';
      else if (val === 'clear') btn.textContent = '✨ 밤벌레소리 켜기';
      else if (val === 'fog') btn.textContent = '🌫️ 심야 바람소리 켜기';
    }

    let audioCtx = null, isSoundOn = false, ambientNoise = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playClinkSound() {
      const ac = getAudio();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1850, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, ac.currentTime + 0.6);
      gain.gain.setValueAtTime(0.35, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.6);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(); osc.stop(ac.currentTime + 0.6);
    }

    document.getElementById('soundToggle').addEventListener('click', () => {
      const ac = getAudio();
      if (!isSoundOn) {
        const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        ambientNoise = ac.createBufferSource();
        ambientNoise.buffer = buf;
        ambientNoise.loop = true;
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 750;
        const gain = ac.createGain();
        gain.gain.value = 0.08;
        ambientNoise.connect(filter); filter.connect(gain); gain.connect(ac.destination);
        ambientNoise.start(0);
        document.getElementById('soundToggle').textContent = '🔊 소리 끄기';
        isSoundOn = true;
      } else {
        ac.suspend();
        document.getElementById('soundToggle').textContent = '🌧️ 소리 켜기';
        isSoundOn = false;
      }
    });
  </script>
